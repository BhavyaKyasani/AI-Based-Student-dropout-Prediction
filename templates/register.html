<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - College Dropout Prediction System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 40px 20px;
        }
        .register-card {
            background-color: #0b0b0b;
            border: 2px solid #D4AF37;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.15);
            max-width: 600px;
            width: 100%;
            padding: 40px 30px;
            animation: fadeIn 0.6s ease forwards;
        }
        .logo-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-header i {
            color: #D4AF37;
            font-size: 44px;
            margin-bottom: 8px;
        }
        .logo-header h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .logo-header p {
            color: #b0b0b0;
            font-size: 13px;
            margin-bottom: 0;
        }
        .form-label {
            font-weight: 500;
            color: #D4AF37;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #ffffff;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1a1a1a;
            border-color: #E6C65C;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }
        .form-control::placeholder {
            color: #BFBFBF !important;
            opacity: 1 !important;
        }
        .input-group .form-control {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }
        .input-group .btn {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            border: 1px solid #2a2a2a;
            border-left: none;
            background-color: #1a1a1a;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-gold {
            background-color: #D4AF37;
            color: #000000;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            border: none;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s ease;
        }
        .btn-gold:hover {
            background-color: #E6C65C;
            transform: translateY(-2px);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="logo-header">
            <i class="fa-solid fa-graduation-cap"></i>
            <h1>ACADEMIA AI</h1>
            <p>Staff Registration Portal</p>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert" style="border-radius: 8px; font-size: 13px;">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="row">
                <!-- Full Name -->
                <div class="col-md-6 mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Enter full name" required>
                </div>
                <!-- Email -->
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter email address" required>
                </div>
            </div>

            <div class="row">
                <!-- Username -->
                <div class="col-md-6 mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Choose username" required>
                </div>
                <!-- Contact Phone -->
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">Contact Phone</label>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="e.g. +91 9988776655">
                </div>
            </div>

            <div class="row">
                <!-- Academic Role -->
                <div class="col-md-6 mb-3">
                    <label for="role" class="form-label">Academic Role</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="Mentor">Mentor / Faculty</option>
                        <option value="Counselor">Counselor</option>
                        <option value="Principal">Principal</option>
                        <option value="Admin">Administrator</option>
                    </select>
                </div>
                <!-- Department Selection -->
                <div class="col-md-6 mb-3">
                    <label for="department_id" class="form-label">Department Selection</label>
                    <select class="form-select" id="department_id" name="department_id">
                        <option value="" selected>Not Applicable / General Staff</option>
                        {% for dept in departments %}
                        <option value="{{ dept.id }}">{{ dept.name }} ({{ dept.code }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row">
                <!-- Password -->
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        <button class="btn btn-outline-gold" type="button" id="togglePasswordBtn">
                            <i class="fa-solid fa-eye" id="togglePasswordIcon" style="color: #D4AF37;"></i>
                        </button>
                    </div>
                </div>
                <!-- Confirm Password -->
                <div class="col-md-6 mb-3">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm password" required>
                        <button class="btn btn-outline-gold" type="button" id="toggleConfirmPasswordBtn">
                            <i class="fa-solid fa-eye" id="toggleConfirmPasswordIcon" style="color: #D4AF37;"></i>
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-gold">Create Account</button>
            <div class="text-center mt-3" style="font-size: 14px;">
                <span class="text-muted" style="color: #BFBFBF !important;">Already have an account?</span> 
                <a href="{{ url_for('auth.login') }}" style="color: #D4AF37; text-decoration: none; font-weight: 600;">Back to Login</a>
            </div>
        </form>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Password Toggle
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const passwordInput = document.getElementById('password');
            const togglePasswordIcon = document.getElementById('togglePasswordIcon');

            if (togglePasswordBtn && passwordInput && togglePasswordIcon) {
                togglePasswordBtn.addEventListener('click', function () {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    togglePasswordIcon.classList.toggle('fa-eye');
                    togglePasswordIcon.classList.toggle('fa-eye-slash');
                });
            }

            // Confirm Password Toggle
            const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPasswordBtn');
            const confirmPasswordInput = document.getElementById('confirm_password');
            const toggleConfirmPasswordIcon = document.getElementById('toggleConfirmPasswordIcon');

            if (toggleConfirmPasswordBtn && confirmPasswordInput && toggleConfirmPasswordIcon) {
                toggleConfirmPasswordBtn.addEventListener('click', function () {
                    const isPassword = confirmPasswordInput.getAttribute('type') === 'password';
                    confirmPasswordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    toggleConfirmPasswordIcon.classList.toggle('fa-eye');
                    toggleConfirmPasswordIcon.classList.toggle('fa-eye-slash');
                });
            }
        });
    </script>
</body>
</html>
